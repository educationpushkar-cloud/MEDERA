<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MedEra</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>MedEra</h1>
    <p>Patient–Hospital Connectivity Platform</p>
</header>

<main>
    <!-- SEARCH HOSPITALS -->
    <section id="search">
        <h2>Find a Hospital</h2>
        <input id="searchCity" placeholder="City (e.g. DEHRADUN)">
        <input id="searchArea" placeholder="Area (e.g. CLEMENT TOWN)">
        <button onclick="searchHospitals()">Search</button>
        <div id="searchResults"></div>
    </section>

    <!-- EMERGENCY: NEAREST HOSPITALS -->
    <section id="emergency-search">
        <h2>Emergency — Nearest Hospitals</h2>
        <input id="emLat" placeholder="Latitude (e.g. 30.30)" type="number" step="0.0001">
        <input id="emLon" placeholder="Longitude (e.g. 78.02)" type="number" step="0.0001">
        <button onclick="findNearest()">Find Nearest</button>
        <div id="nearestResults"></div>
    </section>

    <!-- CREATE EMERGENCY REQUEST -->
    <section id="emergency-request">
        <h2>Raise an Emergency Request</h2>
        <input id="emPatientId" placeholder="Patient ID" type="number" value="1">
        <input id="emReqLat" placeholder="Your latitude" type="number" step="0.0001">
        <input id="emReqLon" placeholder="Your longitude" type="number" step="0.0001">
        <button onclick="raiseEmergency()">Raise Request</button>
        <div id="emergencyState"></div>
    </section>

    <!-- BOOK APPOINTMENT -->
    <section id="book">
        <h2>Book an Appointment</h2>
        <input id="bkPatient" placeholder="Patient ID" type="number" value="1">
        <input id="bkHospital" placeholder="Hospital ID" type="number">
        <input id="bkDoctor" placeholder="Doctor ID" type="number">
        <button onclick="bookAppointment()">Book</button>
        <div id="bookResult"></div>
    </section>

    <!-- MY APPOINTMENTS -->
    <section id="my-appts">
        <h2>My Appointments</h2>
        <input id="myPatient" placeholder="Patient ID" type="number" value="1">
        <button onclick="loadAppointments()">Load</button>
        <div id="appointmentList"></div>
    </section>

    <!-- STAFF LOGIN + BED UPDATE -->
    <section id="staff">
        <h2>Hospital Staff</h2>
        <input id="staffId" placeholder="Staff ID (e.g. STAFF001)">
        <input id="staffPass" placeholder="Password" type="password">
        <button onclick="staffLogin()">Login</button>
        <div id="staffResult"></div>

        <div id="bedUpdatePanel" style="display:none; margin-top: 1em;">
            <h3>Update Bed Availability</h3>
            <input id="bedHospital" placeholder="Hospital ID" type="number" readonly>
            <input id="bedCount" placeholder="Available beds" type="number" min="0">
            <button onclick="updateBeds()">Update</button>
            <div id="bedResult"></div>
        </div>
    </section>
</main>

<footer>
    <p>Team ID DSCPP-III-2026-T223 · Graphic Era (Deemed to be University)</p>
</footer>

<script src="app.js"></script>
</body>
</html>
